<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Task Manager</h1>

    <!-- AUTH -->
    <section id="authView" class="card">
      <div class="tabs">
        <button id="tabLogin" class="tab active" type="button">Login</button>
        <button id="tabRegister" class="tab" type="button">Register</button>
      </div>
      <form id="authForm">
        <input id="name" placeholder="Name" autocomplete="name" hidden />
        <input id="email" type="email" placeholder="Email" autocomplete="email" required />
        <input id="password" type="password" placeholder="Password (min 6)" autocomplete="current-password" minlength="6" required />
        <button id="authSubmit" type="submit">Login</button>
      </form>
    </section>

    <!-- APP -->
    <section id="appView" hidden>
      <div class="topbar">
        <span id="whoami"></span>
        <button id="logoutBtn" type="button" class="secondary">Logout</button>
      </div>

      <form id="taskForm" class="card">
        <input id="title" placeholder="Task title" required />
        <input id="description" placeholder="Description (optional)" />
        <button type="submit">Add task</button>
      </form>

      <div class="filter">
        <label for="statusFilter">Show:</label>
        <select id="statusFilter">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <ul id="taskList"></ul>
    </section>

    <p id="msg" role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
